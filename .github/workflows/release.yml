name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - run: pip install build twine
      - run: python -m build
      - run: twine check dist/*

      - name: Verify tag matches vrec.__version__
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(PYTHONPATH=src python -c 'import vrec; print(vrec.__version__)')"
          if [ "$tag" != "$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match vrec.__version__ ($version)"
            exit 1
          fi

      - name: Create GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes
