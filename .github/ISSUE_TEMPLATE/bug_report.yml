name: Bug report
description: Something didn't work as expected.
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the problem.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: What did you run, and in what order?
      placeholder: |
        1. Ran scripts\windows\test.bat
        2. ...
    validations:
      required: true

  - type: textarea
    id: doctor
    attributes:
      label: Output of `vrec --doctor`
      render: shell
    validations:
      required: false

  - type: textarea
    id: terminal
    attributes:
      label: Output of `test.bat` / the terminal window
      render: shell
    validations:
      required: false

  - type: textarea
    id: log-excerpt
    attributes:
      label: Relevant excerpt from the log file in `data/logs`
      description: Paste only the relevant lines, not the whole file.
      render: text
    validations:
      required: false

  - type: input
    id: vrec-version
    attributes:
      label: vrec version
      description: Output of `vrec --version`
    validations:
      required: true

  - type: input
    id: windows-version
    attributes:
      label: Windows version
      placeholder: e.g. Windows 11 23H2
    validations:
      required: true

  - type: input
    id: obs-version
    attributes:
      label: OBS Studio version
    validations:
      required: true

  - type: input
    id: chrome-version
    attributes:
      label: Google Chrome version
    validations:
      required: true

  - type: input
    id: python-version
    attributes:
      label: Python version
    validations:
      required: false

  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: I removed private links and titles from what I paste above.
          required: true
