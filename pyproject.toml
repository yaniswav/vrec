[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "vrec"
dynamic = ["version"]
description = "Unattended OBS recording of web videos, one after another."
readme = "README.md"
authors = [{ name = "Yanis" }]
keywords = ["obs", "obs-websocket", "recording", "playwright", "chrome", "automation", "vr"]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Development Status :: 4 - Beta",
    "Operating System :: Microsoft :: Windows",
    "Intended Audience :: End Users/Desktop",
    "Topic :: Multimedia :: Video :: Capture",
    "Environment :: Console",
]
dependencies = [
    "playwright>=1.40",
    "obsws-python>=1.6",
    "pillow>=10",
]

[project.urls]
Homepage = "https://github.com/yaniswav/vrec"
Issues = "https://github.com/yaniswav/vrec/issues"
Changelog = "https://github.com/yaniswav/vrec/blob/main/CHANGELOG.md"

[project.optional-dependencies]
build = ["pyinstaller>=6"]
dev = ["pytest>=8", "pytest-cov>=6", "pre-commit>=4", "ruff>=0.5", "mypy>=1.11"]

[project.scripts]
vrec = "vrec.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
vrec = ["js/*.js"]

[tool.setuptools.dynamic]
version = { attr = "vrec.__version__" }

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
files = ["src"]
strict = true
warn_unreachable = true
pretty = true

[[tool.mypy.overrides]]
module = ["obsws_python", "obsws_python.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
source = ["vrec"]
branch = true

[tool.coverage.report]
# Measured at 84% for 0.1.0; the gap is mostly Playwright/OBS glue exercised by real runs.
fail_under = 75
show_missing = true
skip_covered = true
