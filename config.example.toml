# vrec configuration.
#
# Copy this file to config.toml in your data directory (./data/config.toml by
# default) and adjust the values below to match your setup. Every key is
# optional: a missing file, or a missing key, falls back to the value shown
# here, since these are also vrec's built-in defaults.

[obs]
# Hostname of the machine running OBS (with obs-websocket enabled).
host = "127.0.0.1"
# obs-websocket server port. See OBS: Tools > WebSocket Server Settings.
port = 4455
# Name of the OBS audio input source that should carry Chrome's sound.
# vrec creates it automatically on the VB-CABLE "CABLE Output" device if it
# doesn't already exist.
audio_source_name = "Chrome Audio (VB-CABLE)"
# Path to obs64.exe, if vrec can't find it itself (feature auto_start_obs). Leave empty to let vrec
# look in the registry, then in the default install location.
path = ""
# Seconds to wait for OBS's WebSocket server to answer after starting it (feature auto_start_obs).
start_timeout = 60
# Name of the OBS scene vrec records from (feature obs_scene, on by default). Created automatically,
# with a display capture, if it doesn't already exist; reused as is otherwise. Ignored if obs_scene
# is turned off.
scene = "vrec"

[chrome]
# Remote debugging port Chrome was started with (see scripts/windows/launch_chrome.bat).
debug_port = 9222
# Path to chrome.exe, if vrec can't find it itself (feature auto_start_chrome). Leave empty to let
# vrec look in the standard install locations, then in the registry.
path = ""
# Chrome profile directory used when vrec starts the recording Chrome itself (feature
# auto_start_chrome). Leave empty to use VREC_CHROME_PROFILE, then
# %LocalAppData%\vrec\chrome-profile -- the same profile launch_chrome.bat uses.
profile = ""
# Seconds to wait for Chrome's debugging port to answer after starting it (feature auto_start_chrome).
start_timeout = 30

[recording]
# Seconds recorded before playback starts, in case it starts a little early.
lead_in = 2
# Seconds recorded after the video ends.
tail = 2
# Seconds to wait after going fullscreen, so any "Press Esc to exit
# fullscreen" banner has time to disappear before the video is rewound.
fullscreen_settle = 2
# Duration recorded in --test mode, in seconds.
test_duration = 30
# Hard safety cap: give up on a video after roughly (its duration x this
# factor) seconds, in case playback stalls or runs far longer than expected.
max_wall_factor = 3
# Extra seconds added on top of that cap (also used when the duration, or the
# test duration, is unknown).
max_wall_extra = 600
# Stop the batch before a video when the OBS recording folder has less free space than this
# (in GB; feature disk_space_guard).
min_free_gb = 5

[checks]
# Maximum average brightness (0-255) below which a frame is considered "black".
black_level = 20
# Give up on a video that stays black for this many seconds.
abort_if_black_after = 60
# Minimum audio level to consider that there is sound (roughly -50 dB).
audio_level = 0.003

[buffering]
# Seconds of buffered video below which playback and recording are paused,
# to avoid capturing a frozen frame while the player is loading.
pause_below = 2
# Seconds of buffered video required before playback and recording resume.
resume_at = 10
# Give up on a video whose loading stays stalled for this many seconds.
max_stall = 300

[quality]
# Highest video height (in pixels) vrec asks the player for. 0 = no cap, always the best.
# Example: 2160 keeps 4K and below. If a video stalls while loading, vrec retries it once
# at the next lower quality anyway, whatever this value.
max_height = 0

[display]
# Screen the recording Chrome window is moved to (feature auto_place_window).
# "auto" = the largest screen that isn't your main one; or a number ("2") or a name ("DISPLAY3").
screen = "auto"

[audio]
# Audio output that receives the recorded video's sound (feature audio_sink).
# Any part of the device name works; VB-CABLE's playback side is called "CABLE Input".
output = "CABLE Input"
